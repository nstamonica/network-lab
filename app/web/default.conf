server {
    listen 80;

    # Kubernetes checks this to see if web is alive
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Pass /api/ requests to the api robot
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else: show the web page
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}