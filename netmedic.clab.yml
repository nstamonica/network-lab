# NetMedic Phase 1: 3 sites (HQ, Branch A, Branch B).
# OSPF inside each site, eBGP between sites, VLANs 10/20/30/99 at every site.
name: netmedic

mgmt:
  network: netmedic-mgmt
  ipv4-subnet: 172.30.30.0/24

topology:
  defaults:
    kind: linux

  nodes:
    # ---------- HQ (10.1.0.0/16, AS 65001) ----------
    hq-r1:
      image: quay.io/frrouting/frr:10.4.1
      mgmt-ipv4: 172.30.30.11
      binds:
        - configs/hq-r1/frr.conf:/etc/frr/frr.conf
        - configs/common/daemons:/etc/frr/daemons
        - configs/common/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
    hq-sw1:
      image: quay.io/frrouting/frr:10.4.1
      mgmt-ipv4: 172.30.30.12
      binds:
        - configs/hq-sw1/frr.conf:/etc/frr/frr.conf
        - configs/common/daemons:/etc/frr/daemons
        - configs/common/vtysh.conf:/etc/frr/vtysh.conf
        - configs/common/switch-vlans.sh:/switch-vlans.sh
        - configs/common/add-access-port.sh:/add-access-port.sh
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sh /switch-vlans.sh
        - sh /add-access-port.sh eth5 20
    hq-pc1:
      image: ghcr.io/hellt/network-multitool
      mgmt-ipv4: 172.30.30.13
      exec:
        - ip addr add 10.1.10.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.1.10.1
    hq-srv1:
      image: ghcr.io/hellt/network-multitool
      mgmt-ipv4: 172.30.30.14
      exec:
        - ip addr add 10.1.20.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.1.20.1
    hq-guest1:
      image: ghcr.io/hellt/network-multitool
      mgmt-ipv4: 172.30.30.15
      exec:
        - ip addr add 10.1.30.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.1.30.1
    hq-k8s:
      kind: k8s-kind
      startup-config: configs/hq-k8s/kind-config.yaml
    hq-k8s-control-plane:
      kind: ext-container
      exec:
        - ip addr add 10.1.20.20/24 dev eth1
        - ip route add 10.1.0.0/16 via 10.1.20.1
        - ip route add 10.2.0.0/16 via 10.1.20.1
        - ip route add 10.3.0.0/16 via 10.1.20.1
      

    # ---------- BRA (10.2.0.0/16, AS 65002) ----------
    bra-r1:
      image: quay.io/frrouting/frr:10.4.1
      mgmt-ipv4: 172.30.30.21
      binds:
        - configs/bra-r1/frr.conf:/etc/frr/frr.conf
        - configs/common/daemons:/etc/frr/daemons
        - configs/common/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
    bra-sw1:
      image: quay.io/frrouting/frr:10.4.1
      mgmt-ipv4: 172.30.30.22
      binds:
        - configs/bra-sw1/frr.conf:/etc/frr/frr.conf
        - configs/common/daemons:/etc/frr/daemons
        - configs/common/vtysh.conf:/etc/frr/vtysh.conf
        - configs/common/switch-vlans.sh:/switch-vlans.sh
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sh /switch-vlans.sh
    bra-pc1:
      image: ghcr.io/hellt/network-multitool
      mgmt-ipv4: 172.30.30.23
      exec:
        - ip addr add 10.2.10.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.2.10.1
    bra-srv1:
      image: ghcr.io/hellt/network-multitool
      mgmt-ipv4: 172.30.30.24
      exec:
        - ip addr add 10.2.20.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.2.20.1
    bra-guest1:
      image: ghcr.io/hellt/network-multitool
      mgmt-ipv4: 172.30.30.25
      exec:
        - ip addr add 10.2.30.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.2.30.1

    # ---------- BRB (10.3.0.0/16, AS 65003) ----------
    brb-r1:
      image: quay.io/frrouting/frr:10.4.1
      mgmt-ipv4: 172.30.30.31
      binds:
        - configs/brb-r1/frr.conf:/etc/frr/frr.conf
        - configs/common/daemons:/etc/frr/daemons
        - configs/common/vtysh.conf:/etc/frr/vtysh.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
    brb-sw1:
      image: quay.io/frrouting/frr:10.4.1
      mgmt-ipv4: 172.30.30.32
      binds:
        - configs/brb-sw1/frr.conf:/etc/frr/frr.conf
        - configs/common/daemons:/etc/frr/daemons
        - configs/common/vtysh.conf:/etc/frr/vtysh.conf
        - configs/common/switch-vlans.sh:/switch-vlans.sh
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sh /switch-vlans.sh
    brb-pc1:
      image: ghcr.io/hellt/network-multitool
      mgmt-ipv4: 172.30.30.33
      exec:
        - ip addr add 10.3.10.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.3.10.1
    brb-srv1:
      image: ghcr.io/hellt/network-multitool
      mgmt-ipv4: 172.30.30.34
      exec:
        - ip addr add 10.3.20.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.3.20.1
    brb-guest1:
      image: ghcr.io/hellt/network-multitool
      mgmt-ipv4: 172.30.30.35
      exec:
        - ip addr add 10.3.30.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.3.30.1

  links:
    # Inside HQ
    - endpoints: ["hq-r1:eth1", "hq-sw1:eth1"]
    - endpoints: ["hq-sw1:eth2", "hq-pc1:eth1"]
    - endpoints: ["hq-sw1:eth3", "hq-srv1:eth1"]
    - endpoints: ["hq-sw1:eth4", "hq-guest1:eth1"]
    - endpoints: ["hq-sw1:eth5", "hq-k8s-control-plane:eth1"]
    # Inside BRA
    - endpoints: ["bra-r1:eth1", "bra-sw1:eth1"]
    - endpoints: ["bra-sw1:eth2", "bra-pc1:eth1"]
    - endpoints: ["bra-sw1:eth3", "bra-srv1:eth1"]
    - endpoints: ["bra-sw1:eth4", "bra-guest1:eth1"]
    # Inside BRB
    - endpoints: ["brb-r1:eth1", "brb-sw1:eth1"]
    - endpoints: ["brb-sw1:eth2", "brb-pc1:eth1"]
    - endpoints: ["brb-sw1:eth3", "brb-srv1:eth1"]
    - endpoints: ["brb-sw1:eth4", "brb-guest1:eth1"]
    # WAN (hub and spoke: HQ is the hub)
    - endpoints: ["hq-r1:eth2", "bra-r1:eth2"]  # 10.255.0.1 <-> 10.255.0.2
    - endpoints: ["hq-r1:eth3", "brb-r1:eth2"]  # 10.255.0.5 <-> 10.255.0.6
