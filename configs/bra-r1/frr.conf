frr version 10.4
frr defaults traditional
hostname bra-r1
service integrated-vtysh-config
!
! Holds this site's summary route so BGP can advertise it.
ip route 10.2.0.0/16 blackhole
!
interface lo
 ip address 10.2.255.1/32
 ip ospf area 0
exit
!
interface eth1
 description LAN uplink to bra-sw1
 ip address 10.2.254.1/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth2
 description WAN to hq-r1
 ip address 10.255.0.2/30
exit
!
! Small lab: share the other sites' routes inside this site.
router ospf
 ospf router-id 10.2.255.1
 redistribute bgp
exit
!
router bgp 65002
 bgp router-id 10.2.255.1
 neighbor 10.255.0.1 remote-as 65001
 neighbor 10.255.0.1 description hq-r1
 !
 address-family ipv4 unicast
  network 10.2.0.0/16
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.1 route-map SITES-IN in
  neighbor 10.255.0.1 route-map SITES-OUT out
 exit-address-family
exit
!
! Only site summaries (10.x.0.0/16) may cross the WAN, in or out.
ip prefix-list SITE-SUMMARIES seq 10 permit 10.0.0.0/8 ge 16 le 16
!
route-map SITES-IN permit 10
 match ip address prefix-list SITE-SUMMARIES
exit
!
route-map SITES-OUT permit 10
 match ip address prefix-list SITE-SUMMARIES
exit
!
end
