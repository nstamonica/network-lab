frr version 10.4
frr defaults traditional
hostname brb-sw1
service integrated-vtysh-config
!
interface lo
 ip address 10.3.255.2/32
 ip ospf area 0
exit
!
interface eth1
 description Uplink to brb-r1
 ip address 10.3.254.2/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface vlan10
 description VLAN 10 USERS gateway
 ip address 10.3.10.1/24
 ip ospf area 0
 ip ospf passive
exit
!
interface vlan20
 description VLAN 20 SERVERS gateway
 ip address 10.3.20.1/24
 ip ospf area 0
 ip ospf passive
exit
!
interface vlan30
 description VLAN 30 GUEST gateway (internet-only rule comes with the firewall phase)
 ip address 10.3.30.1/24
 ip ospf area 0
 ip ospf passive
exit
!
interface vlan99
 description VLAN 99 MANAGEMENT gateway
 ip address 10.3.99.1/24
 ip ospf area 0
 ip ospf passive
exit
!
router ospf
 ospf router-id 10.3.255.2
exit
!
end
